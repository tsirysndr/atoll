name: nix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21
      - name: Build and smoke-test Nix release
        working-directory: .dagger
        run: dagger api call -m ci nix --source .. --target "${{ matrix.target }}"
