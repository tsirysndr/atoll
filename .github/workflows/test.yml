name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir tests and MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
      ATOLL_BLOB_STORAGE: postgres
      ATOLL_BLOB_CLEANUP_ENABLED: "false"
      ATOLL_IDENTITY_REFRESH_ENABLED: "false"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-${{ runner.arch }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      # The test alias creates and migrates the database automatically.
      - name: Run project checks and tests
        run: mix precommit

      - name: Run MinIO integration tests
        run: bash scripts/test_minio.sh

      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code
