rule_files:
  - "alerts.yml"
evaluation_interval: "1m"
tests:
  - name: "Scrape delay, recovery, and unrelated jobs"
    interval: "1m"
    input_series:
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "0 0 0 1 1"
      - series: 'up{job="unrelated",instance="other:443"}'
        values: "0x4"
    alert_rule_test:
      - eval_time: "1m"
        alertname: "AtollScrapeUnavailable"
        exp_alerts: []
      - eval_time: "2m"
        alertname: "AtollScrapeUnavailable"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "critical"
            exp_annotations:
              summary: "Atoll metrics scrape is unavailable"
      - eval_time: "3m"
        alertname: "AtollScrapeUnavailable"
        exp_alerts: []
  - name: "Sustained server errors preserve instance labels and clear after recovery"
    interval: "1m"
    input_series:
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="2xx"}'
        values: "0+100x10 1120+120x10"
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="5xx"}'
        values: "0+20x10 200+0x10"
      - series: 'atoll_http_requests_total{job="atoll",instance="healthy:443",status_class="2xx"}'
        values: "0+120x21"
      - series: 'atoll_http_requests_total{job="atoll",instance="healthy:443",status_class="5xx"}'
        values: "0x21"
    alert_rule_test:
      - eval_time: "4m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts: []
      - eval_time: "8m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "warning"
            exp_annotations:
              summary: "Atoll has sustained server errors"
      - eval_time: "20m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts: []
  - name: "Low volume and idle traffic do not trigger HTTP warnings"
    interval: "1m"
    input_series:
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="5xx"}'
        values: "0+1x15"
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="2xx"}'
        values: "0x15"
      - series: 'atoll_http_requests_total{job="atoll",instance="idle:443",status_class="5xx"}'
        values: "0x15"
      - series: 'atoll_http_requests_total{job="atoll",instance="idle:443",status_class="2xx"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: "15m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts: []
  - name: "Readiness delay, healthy probes, and recovery"
    interval: "1m"
    input_series:
      - series: 'atoll_readiness_checks_total{job="atoll",instance="pds:443",outcome="unavailable"}'
        values: "0+2x5 10x10"
      - series: 'atoll_readiness_checks_total{job="atoll",instance="pds:443",outcome="ready"}'
        values: "0x5 2+2x10"
      - series: 'atoll_readiness_checks_total{job="atoll",instance="healthy:443",outcome="ready"}'
        values: "0+2x16"
      - series: 'atoll_readiness_checks_total{job="atoll",instance="healthy:443",outcome="unavailable"}'
        values: "0x16"
    alert_rule_test:
      - eval_time: "2m"
        alertname: "AtollReadinessFailures"
        exp_alerts: []
      - eval_time: "4m"
        alertname: "AtollReadinessFailures"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "critical"
            exp_annotations:
              summary: "Atoll database readiness checks are failing"
      - eval_time: "15m"
        alertname: "AtollReadinessFailures"
        exp_alerts: []
  - name: "Worker run and item failures both alert without duplicate alerts"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_runs_total{job="atoll",instance="pds:443",worker="blob_cleanup",result="timeout"}'
        values: "0 1x15"
      - series: 'atoll_worker_items_failed_total{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "0 2x15"
      - series: 'atoll_worker_runs_total{job="atoll",instance="pds:443",worker="signup_retry",result="ok"}'
        values: "0+1x16"
      - series: 'atoll_worker_items_failed_total{job="atoll",instance="pds:443",worker="signup_retry"}'
        values: "0 1x15"
      - series: 'atoll_worker_runs_total{job="atoll",instance="pds:443",worker="identity_refresh",result="failed"}'
        values: "0 1x15"
    alert_rule_test:
      - eval_time: "0m"
        alertname: "AtollWorkerFailures"
        exp_alerts: []
      - eval_time: "2m"
        alertname: "AtollWorkerFailures"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "warning"
              worker: "blob_cleanup"
            exp_annotations:
              summary: "Atoll worker reported failures in the last ten minutes"
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "warning"
              worker: "signup_retry"
            exp_annotations:
              summary: "Atoll worker reported failures in the last ten minutes"
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              severity: "warning"
              worker: "identity_refresh"
            exp_annotations:
              summary: "Atoll worker reported failures in the last ten minutes"
      - eval_time: "15m"
        alertname: "AtollWorkerFailures"
        exp_alerts: []
  - name: "Counter resets and missing or idle probes do not imply failures"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_runs_total{job="atoll",instance="pds:443",worker="blob_cleanup",result="failed"}'
        values: "100x3 0x12"
      - series: 'atoll_worker_items_failed_total{job="atoll",instance="pds:443",worker="signup_retry"}'
        values: "50x3 0x12"
      - series: 'atoll_readiness_checks_total{job="atoll",instance="pds:443",outcome="unavailable"}'
        values: "20x3 0x12"
      - series: 'atoll_readiness_checks_total{job="atoll",instance="pds:443",outcome="ready"}'
        values: "100x3 0x12"
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="5xx"}'
        values: "100x3 0x12"
      - series: 'atoll_http_requests_total{job="atoll",instance="pds:443",status_class="2xx"}'
        values: "1000x3 0+120x12"
    alert_rule_test:
      - eval_time: "6m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts: []
      - eval_time: "6m"
        alertname: "AtollReadinessFailures"
        exp_alerts: []
      - eval_time: "6m"
        alertname: "AtollWorkerFailures"
        exp_alerts: []
      - eval_time: "15m"
        alertname: "AtollWorkerFailures"
        exp_alerts: []
  - name: "Missing series do not create phantom alerts"
    interval: "1m"
    input_series: []
    alert_rule_test:
      - eval_time: "15m"
        alertname: "AtollScrapeUnavailable"
        exp_alerts: []
      - eval_time: "15m"
        alertname: "AtollHighServerErrorRate"
        exp_alerts: []
      - eval_time: "15m"
        alertname: "AtollReadinessFailures"
        exp_alerts: []
      - eval_time: "15m"
        alertname: "AtollWorkerFailures"
        exp_alerts: []
  - name: "Observed worker stalls, fires after grace, and clears on reschedule"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_progress_deadline_seconds{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "60x4 1000x3"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x8"
    alert_rule_test:
      - eval_time: "3m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts: []
      - eval_time: "4m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              worker: "blob_cleanup"
              severity: "warning"
            exp_annotations:
              summary: "Atoll worker has stopped reporting scheduled progress"
      - eval_time: "5m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts: []
  - name: "Idle schedules, unobserved workers, down targets and unrelated jobs stay quiet"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_progress_deadline_seconds{job="atoll",instance="pds:443",worker="identity_refresh"}'
        values: "60+60x10"
      - series: 'atoll_worker_progress_deadline_seconds{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "0x10"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x10"
      - series: 'atoll_worker_progress_deadline_seconds{job="atoll",instance="down:443",worker="blob_cleanup"}'
        values: "60x10"
      - series: 'up{job="atoll",instance="down:443"}'
        values: "0x10"
      - series: 'atoll_worker_progress_deadline_seconds{job="other",instance="other:443",worker="blob_cleanup"}'
        values: "60x10"
      - series: 'up{job="other",instance="other:443"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: "10m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts: []
  - name: "Collector reset clears a pending worker deadline"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_progress_deadline_seconds{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "60x3 0x4"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x8"
    alert_rule_test:
      - eval_time: "4m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts: []
      - eval_time: "7m"
        alertname: "AtollWorkerProgressOverdue"
        exp_alerts: []
  - name: "Configured missing worker fires without a prior heartbeat and clears on registration"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_expected{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "1x5"
      - series: 'atoll_worker_present{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "0x2 1x2"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: "1m"
        alertname: "AtollWorkerMissing"
        exp_alerts: []
      - eval_time: "2m"
        alertname: "AtollWorkerMissing"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "pds:443"
              worker: "blob_cleanup"
              severity: "warning"
            exp_annotations:
              summary: "A configured Atoll worker process is missing"
      - eval_time: "3m"
        alertname: "AtollWorkerMissing"
        exp_alerts: []
  - name: "Disabled, present, unscrapeable, unknown and unrelated workers do not trigger missing alerts"
    interval: "1m"
    input_series:
      - series: 'atoll_worker_expected{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "0x5"
      - series: 'atoll_worker_present{job="atoll",instance="pds:443",worker="blob_cleanup"}'
        values: "0x5"
      - series: 'atoll_worker_expected{job="atoll",instance="pds:443",worker="identity_refresh"}'
        values: "1x5"
      - series: 'atoll_worker_present{job="atoll",instance="pds:443",worker="identity_refresh"}'
        values: "1x5"
      - series: 'atoll_worker_expected{job="atoll",instance="pds:443",worker="signup_cleanup"}'
        values: "1x5"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x5"
      - series: 'atoll_worker_expected{job="atoll",instance="down:443",worker="blob_cleanup"}'
        values: "1x5"
      - series: 'atoll_worker_present{job="atoll",instance="down:443",worker="blob_cleanup"}'
        values: "0x5"
      - series: 'up{job="atoll",instance="down:443"}'
        values: "0x5"
      - series: 'atoll_worker_expected{job="other",instance="other:443",worker="blob_cleanup"}'
        values: "1x5"
      - series: 'atoll_worker_present{job="other",instance="other:443",worker="blob_cleanup"}'
        values: "0x5"
      - series: 'up{job="other",instance="other:443"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "AtollWorkerMissing"
        exp_alerts: []
  - name: "Database queue and total latency fire per instance and recover"
    interval: "1m"
    input_series:
      - series: 'atoll_database_queries_total{job="atoll",instance="slow:443"}'
        values: "0+120x12 1560+120x10"
      - series: 'atoll_database_queue_seconds_total{job="atoll",instance="slow:443"}'
        values: "0+24x12 288+0x10"
      - series: 'atoll_database_duration_seconds_total{job="atoll",instance="slow:443"}'
        values: "0+240x12 2880+0x10"
      - series: 'atoll_database_queries_total{job="atoll",instance="healthy:443"}'
        values: "0+120x23"
      - series: 'atoll_database_queue_seconds_total{job="atoll",instance="healthy:443"}'
        values: "0+1x23"
      - series: 'atoll_database_duration_seconds_total{job="atoll",instance="healthy:443"}'
        values: "0+12x23"
    alert_rule_test:
      - eval_time: "4m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "4m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []
      - eval_time: "10m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "slow:443"
              severity: "warning"
            exp_annotations:
              summary: "Atoll has sustained database pool wait"
      - eval_time: "10m"
        alertname: "AtollDatabaseLatency"
        exp_alerts:
          - exp_labels:
              job: "atoll"
              instance: "slow:443"
              severity: "warning"
            exp_annotations:
              summary: "Atoll has sustained database query latency"
      - eval_time: "22m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "22m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []
  - name: "Database alerts ignore low volume, idle, incomplete and unrelated series"
    interval: "1m"
    input_series:
      - series: 'atoll_database_queries_total{job="atoll",instance="low:443"}'
        values: "0+6x15"
      - series: 'atoll_database_queue_seconds_total{job="atoll",instance="low:443"}'
        values: "0+60x15"
      - series: 'atoll_database_duration_seconds_total{job="atoll",instance="low:443"}'
        values: "0+120x15"
      - series: 'atoll_database_queries_total{job="atoll",instance="idle:443"}'
        values: "0x15"
      - series: 'atoll_database_queue_seconds_total{job="atoll",instance="idle:443"}'
        values: "0x15"
      - series: 'atoll_database_duration_seconds_total{job="atoll",instance="idle:443"}'
        values: "0x15"
      - series: 'atoll_database_queries_total{job="atoll",instance="incomplete:443"}'
        values: "0+120x15"
      - series: 'atoll_database_queries_total{job="other",instance="other:443"}'
        values: "0+120x15"
      - series: 'atoll_database_queue_seconds_total{job="other",instance="other:443"}'
        values: "0+120x15"
      - series: 'atoll_database_duration_seconds_total{job="other",instance="other:443"}'
        values: "0+240x15"
    alert_rule_test:
      - eval_time: "15m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "15m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []
  - name: "Database counter resets do not create latency spikes"
    interval: "1m"
    input_series:
      - series: 'atoll_database_queries_total{job="atoll",instance="restart:443"}'
        values: "10000+120x6 0+120x10"
      - series: 'atoll_database_queue_seconds_total{job="atoll",instance="restart:443"}'
        values: "1000+1x6 0+1x10"
      - series: 'atoll_database_duration_seconds_total{job="atoll",instance="restart:443"}'
        values: "10000+12x6 0+12x10"
    alert_rule_test:
      - eval_time: "6m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "12m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "16m"
        alertname: "AtollDatabasePoolWait"
        exp_alerts: []
      - eval_time: "6m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []
      - eval_time: "12m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []
      - eval_time: "16m"
        alertname: "AtollDatabaseLatency"
        exp_alerts: []

  - name: "Database inventory failures, recovery and disabled polling"
    interval: "1m"
    input_series:
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="pds:443"}'
        values: "1x5"
      - series: 'atoll_database_inventory_available{job="atoll",instance="pds:443"}'
        values: "0 0 0 1 1 1"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="pds:443"}'
        values: "0 0 0 180 240 300"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x5"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="disabled:443"}'
        values: "0x5"
      - series: 'atoll_database_inventory_available{job="atoll",instance="disabled:443"}'
        values: "0x5"
      - series: 'up{job="atoll",instance="disabled:443"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: "1m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts: []
      - eval_time: "2m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts:
          - exp_labels: {job: atoll, instance: "pds:443", severity: warning}
            exp_annotations: {summary: "Atoll database inventory is unavailable or stale"}
      - eval_time: "3m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts: []

  - name: "Stopped polling becomes stale even when last observation succeeded"
    interval: "1m"
    input_series:
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="pds:443"}'
        values: "1x7"
      - series: 'atoll_database_inventory_available{job="atoll",instance="pds:443"}'
        values: "1x7"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="pds:443"}'
        values: "1x7"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x6 0"
    alert_rule_test:
      - eval_time: "4m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts: []
      - eval_time: "5m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts:
          - exp_labels: {job: atoll, instance: "pds:443", severity: warning}
            exp_annotations: {summary: "Atoll database inventory is unavailable or stale"}
      - eval_time: "7m"
        alertname: "AtollDatabaseInventoryUnavailable"
        exp_alerts: []

  - name: "Old cleanup jobs alert per backend, fresh snapshots gate firing and clearing"
    interval: "1m"
    input_series:
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="pds:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_available{job="atoll",instance="pds:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="pds:443"}'
        values: "0+60x1446 86760x4"
      - series: 'up{job="atoll",instance="pds:443"}'
        values: "1x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="pds:443",backend="s3"}'
        values: "3x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="pds:443",backend="s3"}'
        values: "1x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="pds:443",backend="postgres"}'
        values: "0x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="pds:443",backend="postgres"}'
        values: "0x1450"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="down:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_available{job="atoll",instance="down:443"}'
        values: "1x1450"
      - series: 'up{job="atoll",instance="down:443"}'
        values: "0x1450"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="down:443"}'
        values: "0+60x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="down:443",backend="s3"}'
        values: "3x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="down:443",backend="s3"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="disabled:443"}'
        values: "0x1450"
      - series: 'atoll_database_inventory_available{job="atoll",instance="disabled:443"}'
        values: "1x1450"
      - series: 'up{job="atoll",instance="disabled:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="disabled:443"}'
        values: "0+60x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="disabled:443",backend="s3"}'
        values: "3x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="disabled:443",backend="s3"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="failed:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_available{job="atoll",instance="failed:443"}'
        values: "0x1450"
      - series: 'up{job="atoll",instance="failed:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="failed:443"}'
        values: "0+60x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="failed:443",backend="s3"}'
        values: "3x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="failed:443",backend="s3"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="empty:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_available{job="atoll",instance="empty:443"}'
        values: "1x1450"
      - series: 'up{job="atoll",instance="empty:443"}'
        values: "1x1450"
      - series: 'atoll_database_inventory_success_time_seconds{job="atoll",instance="empty:443"}'
        values: "0+60x1450"
      - series: 'atoll_blob_cleanup_pending{job="atoll",instance="empty:443",backend="s3"}'
        values: "0x1450"
      - series: 'atoll_blob_cleanup_oldest_time_seconds{job="atoll",instance="empty:443",backend="s3"}'
        values: "0x1450"
      - series: 'atoll_database_inventory_enabled{job="atoll",instance="young:443"}'
